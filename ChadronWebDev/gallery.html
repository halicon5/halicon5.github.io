<div id="galleryOverlay" onclick="hideOverlay();">
	<div id="galleryContainer">
		<div style="text-align: right;"><a class="closeOverlay" href="javascript: hideOverlay();" onclick="hideOverlay();">Close Overlay</a></div>
		<img id="imageShowcase" src="images/background1.jpg">

<script>
	var overlayElem = document.getElementById("galleryOverlay");
	var imageShowcase = document.getElementById("imageShowcase");

	function showOverlay() {
		overlayElem.style.display = "grid";
	}

	function hideOverlay() {
		overlayElem.style.display = "none";
	}

	function showcaseImage(imgUrl) {
		console.log(imgUrl);
		imageShowcase.setAttribute("src", imgUrl);	
		showOverlay();
	}
</script>
